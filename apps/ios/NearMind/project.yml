name: NearMind
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages: {}
targets:
  NearMind:
    type: application
    platform: iOS
    sources:
      - path: NearMind
    settings:
      base:
        PRODUCT_NAME: NearMind
        PRODUCT_BUNDLE_IDENTIFIER: ai.nearmind.app
        INFOPLIST_FILE: NearMind/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: NearMind/Resources/Info.plist
      properties:
        NSMicrophoneUsageDescription: NearMind uses the microphone only when you start a Live Assist session, so it can transcribe your voice and provide real-time help.
  NearMindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NearMindTests
    dependencies:
      - target: NearMind
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.nearmind.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  NearMind:
    build:
      targets:
        NearMind: all
        NearMindTests: [test]
    test:
      targets:
        - NearMindTests
      gatherCoverageData: false
